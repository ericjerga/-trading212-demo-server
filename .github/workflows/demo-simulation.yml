name: Demo-Simulation automatisch starten

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-simulator-ledger
  cancel-in-progress: false

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Privaten Speicherzweig auschecken
        uses: actions/checkout@v4
        with:
          ref: bot-state
          persist-credentials: true

      - name: Simulationsstand sicher aktualisieren
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_TOKEN"
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('state.json')
          previous = {}
          if path.exists():
              previous = json.loads(path.read_text(encoding='utf-8'))
          pathlib.Path('request.json').write_text(
              json.dumps({'previous_state': previous}), encoding='utf-8')
          PY
          curl --fail --show-error --silent --retry 2 --max-time 120 \
            -X POST -H "Content-Type: application/json" \
            -H "X-Dashboard-Token: $DASHBOARD_TOKEN" \
            --data-binary @request.json \
            -o response.json \
            https://trading212-demo-server.onrender.com/step
          python3 - <<'PY'
          import json, math, pathlib
          response = json.loads(pathlib.Path('response.json').read_text(encoding='utf-8'))
          fields = ('cash','shares','price','peak','tick','halted','symbol','trades','last_trade_date','last_trade_at','entry_price','equity_history','last_step_at','crypto')
          state = {key: response.get(key) for key in fields}
          if not isinstance(state['tick'], int) or state['tick'] < 1:
              raise ValueError('Invalid step response: no simulation tick')
          if state.get('last_trade_at') is not None and not isinstance(state['last_trade_at'], str):
              raise ValueError('Invalid last trade timestamp')
          if not isinstance(state['trades'], list):
              raise ValueError('Invalid trades list')
          if not all(isinstance(state[k], (int,float)) and math.isfinite(state[k]) and state[k] >= 0 for k in ('cash','shares','price','peak')):
              raise ValueError('Invalid account balances')
          state['entry_price'] = state['entry_price'] or 0
          state['equity_history'] = (state['equity_history'] or [])[-120:]
          if not isinstance(state['equity_history'], list):
              raise ValueError('Invalid equity history')
          if not isinstance(state['crypto'], dict) or not isinstance(state['crypto'].get('trades'), list):
              raise ValueError('Invalid crypto ledger')
          if state['crypto'].get('last_trade_at') is not None and not isinstance(state['crypto']['last_trade_at'], str):
              raise ValueError('Invalid crypto last trade timestamp')
          pathlib.Path('state.json').write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm -f request.json response.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Save virtual trading ledger"
            git push origin HEAD:bot-state
          fi
