name: Offensive paper strategy research
on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_offensive_strategy.py'
      - '.github/workflows/offensive-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Historical backtest and risk gate
        run: python -m research.run_backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offensive-backtest-report
          path: offensive-backtest-report.json
